<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>

    <style>

        .gallery-image{
            border:2px solid black;
            width:150px;
            height:100px;
        }

    </style>

</head>

<body>

    <h2>Community Events Gallery</h2>

    <table border="1">

        <tr>

            <td>
                <img
                src="https://via.placeholder.com/150"
                alt="Music Event"
                title="Music Event"
                class="gallery-image">

                <p>Music Festival</p>
            </td>

            <td>
                <img
                src="https://via.placeholder.com/150"
                alt="Dance Event"
                title="Dance Event"
                class="gallery-image">

                <p>Dance Show</p>
            </td>

            <td>
                <img
                src="https://via.placeholder.com/150"
                alt="Art Event"
                title="Art Event"
                class="gallery-image">

                <p>Art Workshop</p>
            </td>

        </tr>

        <tr>

            <td>
                <img
                src="https://via.placeholder.com/150"
                alt="Food Event"
                title="Food Event"
                class="gallery-image">

                <p>Food Carnival</p>
            </td>

            <td>
                <img
                src="https://via.placeholder.com/150"
                alt="Sports Event"
                title="Sports Event"
                class="gallery-image">

                <p>Sports Meet</p>
            </td>

            <td>
                <img
                src="https://via.placeholder.com/150"
                alt="Community Event"
                title="Community Event"
                class="gallery-image">

                <p>Community Gathering</p>
            </td>

        </tr>

    </table>

</body>

</html>
