<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <style>

        #welcomeBanner{
            background-color: blue;
            color: white;
            padding: 15px;
        }

        .highlight{
            background-color: yellow;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div id="welcomeBanner">

        Welcome Back User!

        <span style="color:red;font-weight:bold;">
            Special Offer: Free Registration Today!
        </span>

    </div>

    <p class="highlight">
        Community Event Registration Open.
    </p>

    <p class="highlight">
        Limited Seats Available.
    </p>

</body>

</html>
