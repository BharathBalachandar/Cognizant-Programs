<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video Invite</title>
</head>

<body>

    <h2>Event Promo Video</h2>

    <video
    width="400"
    controls
    oncanplay="videoReady()">

        <source
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        type="video/mp4">

    </video>

    <p id="message"></p>

    <script>

        function videoReady() {

            document.getElementById("message")
            .innerHTML =
            "Video ready to play";
        }

        window.onbeforeunload = function() {

            return "Form not completed. Are you sure you want to leave?";
        };

    </script>

</body>

</html>
