<!DOCTYPE html>
<html>
<head>
    <title>Exercise 11 - Forms</title>
</head>
<body>

    <h1>Event Registration Form</h1>

    <form id="registrationForm">

        <input
            type="text"
            name="name"
            placeholder="Enter Name">

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Enter Email">

        <br><br>

        <select name="event">
            <option>Music Festival</option>
            <option>Dance Show</option>
            <option>Art Workshop</option>
        </select>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="error"></p>

    <script src="main.js"></script>

</body>
</html>
